name: Deploy Anchor assistant

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: anchor-assistant-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Verify assistant policy, transport, and quota SQL
        run: node --test tests/program-assistant.test.mjs
      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.120.0
      - name: Apply assistant quota and deploy authenticated Edge Function
        run: node scripts/deploy-assistant.mjs
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
