name: Publish Anchor to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install locked dependencies
        run: npm ci
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Validate TypeScript
        run: npm run typecheck
      - name: Validate browser module syntax
        run: npm run check
      - name: Check source formatting
        run: npm run format:check
      - name: Validate the reviewed bilingual knowledge corpus
        run: npm run knowledge:check
      - name: Build an isolated browser-test artifact
        run: npm run build
        env:
          PUBLIC_BASE_PATH: /Anchor/
      - name: Install real browser and system libraries
        run: npx playwright install --with-deps chromium
      - name: Verify the app under its repository path
        run: |
          node server.mjs > /tmp/anchor-preview.log 2>&1 &
          ANCHOR_SERVER_PID=$!
          trap 'kill "$ANCHOR_SERVER_PID"' EXIT
          node --input-type=module -e 'for (let attempt = 0; attempt < 30; attempt++) { try { const response = await fetch(process.env.ANCHOR_BROWSER_TEST_URL); if (response.ok) process.exit(0); } catch {} await new Promise(resolve => setTimeout(resolve, 250)); } process.exit(1);'
          npm test
        env:
          ANCHOR_PORT: '4317'
          ANCHOR_SERVE_ROOT: dist/pages
          ANCHOR_BASE_PATH: /Anchor/
          ANCHOR_BROWSER_TEST_URL: http://127.0.0.1:4317/Anchor/
          ANCHOR_PLAYWRIGHT_MODULE: file://${{ github.workspace }}/node_modules/playwright/index.mjs
      - name: Verify model reproducibility, source maintenance, and audit failures
        run: npm run test:python
      - name: Build the release with public account settings
        run: npm run build
        env:
          PUBLIC_BASE_PATH: /Anchor/
          PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.PUBLIC_GOOGLE_CLIENT_ID }}
      - name: Audit deployment assets and policy sources
        run: python scripts/audit_sources.py --site dist/pages
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
